[project]
name = "autohunter"
version = "0.2.0"
description = "Find internships from public job boards, tailor resumes and fill applications with Claude Code."
requires-python = ">=3.10"
dependencies = [
    # Only needed for resume editing (render / dump / letter). Job search is stdlib-only.
    "python-docx>=1.1",
    # Only needed for form filling (`apply`). Uses the installed Google Chrome, so no
    # `playwright install` browser download is needed.
    "playwright>=1.50",
]

[tool.uv]
package = false
